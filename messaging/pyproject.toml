[project]
name = "cobranza-messaging"
version = "0.1.0"
description = "Mensajería de cobranza NSF: SMS de confirmación, recordatorios y links de pago"
requires-python = ">=3.12"
# "cobranza" es el núcleo (carpeta backend/); se instala antes que este paquete.
dependencies = [
    "cobranza",
    "psycopg[binary,pool]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
