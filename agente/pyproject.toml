[project]
name = "cobranza-agent"
version = "0.1.0"
description = "Agente de voz de cobranza NSF: conversación con Claude, prompt, herramientas y chat de prueba"
requires-python = ">=3.12"
# No depende del núcleo: le pide todo a la API del backend por HTTP.
dependencies = [
    "anthropic>=1.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Las pruebas de punta a punta levantan la API del backend en memoria: necesitan el núcleo
# (carpeta backend/), que el Dockerfile instala aparte.
dev = ["pytest>=8"]
# Capa de voz (Pipecat): detección de voz, AssemblyAI, Deepgram y WebRTC para probar en el navegador.
# Versión fija: Pipecat cambia seguido y su API se revisó en la 1.16.0.
voz = ["pipecat-ai[deepgram,webrtc,silero,runner]==1.16.0"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cobranza_agent.application" = ["prompts/*.md"]
"cobranza_agent.infrastructure" = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
