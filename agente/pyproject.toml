[project]
name = "cobranza-agent"
version = "0.1.0"
description = "Agente de voz de cobranza NSF: conversación con Claude, prompt, herramientas y chat de prueba"
requires-python = ">=3.12"
# "cobranza" es el núcleo (carpeta backend/); se instala antes que este paquete.
dependencies = [
    "cobranza",
    "anthropic>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cobranza_agent.application" = ["prompts/*.md"]
"cobranza_agent.infrastructure" = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
